<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WiTH ARCHITECTURE Interior Remodeling Studio</title>
<style>
  :root {
    /* mood: studio (default light professional) */
    --bg: #F5F5F3;
    --surface: #FFFFFF;
    --surface-2: #FBFBFA;
    --ink: #1B1D22;
    --ink-muted: #666A72;
    --accent: #1E3A5F;
    --accent-ink: #FFFFFF;
    --accent-soft: #E7EEF3;
    --line: #E4E3E0;
    --line-strong: #C9C7C0;
    --shadow: 0 1px 2px rgba(20,20,25,0.05), 0 10px 28px rgba(20,20,25,0.06);
    --font-display: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR', sans-serif;
    --font-body: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR', sans-serif;
    --font-mono: 'SFMono-Regular','Consolas','Liberation Mono', monospace;
  }
  :root[data-mood="noir"] {
    --bg: #121316;
    --surface: #1A1C1F;
    --surface-2: #202226;
    --ink: #ECECEA;
    --ink-muted: #9A9CA3;
    --accent: #C9A227;
    --accent-ink: #1F1706;
    --accent-soft: #2E2712;
    --line: #2A2C30;
    --line-strong: #3C3F44;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.45);
  }
  :root[data-mood="sand"] {
    --bg: #F1ECE3;
    --surface: #FAF7F2;
    --surface-2: #FFFFFF;
    --ink: #2B241C;
    --ink-muted: #7A6F60;
    --accent: #6B3F3F;
    --accent-ink: #FBF3F0;
    --accent-soft: #EDE0DD;
    --line: #E1D8CB;
    --line-strong: #C7BBA9;
    --shadow: 0 1px 2px rgba(43,36,28,0.08), 0 10px 28px rgba(43,36,28,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  a { color: var(--accent); }

  .app-shell { max-width: 1360px; margin: 0 auto; padding: 40px 28px 80px; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 20px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px;
  }
  .version-tag {
    color: var(--accent); border: 1px solid var(--accent); border-radius: 3px;
    padding: 1px 6px; letter-spacing: 0.04em; font-weight: 700;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 34px;
    margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.02em;
  }
  .lede { color: var(--ink-muted); margin: 0; max-width: 62ch; font-size: 15px; }

  .header-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .mood-switch {
    display: inline-flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 3px;
  }
  .mood-btn {
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.03em;
    background: transparent; border: none; color: var(--ink-muted);
    padding: 7px 12px; border-radius: 4px; cursor: pointer;
  }
  .mood-btn.active { background: var(--accent); color: var(--accent-ink); }
  .reset-btn {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    background: transparent; border: 1px solid var(--line-strong); color: var(--ink-muted);
    padding: 9px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  main.layout {
    display: grid; grid-template-columns: 1fr 420px; gap: 28px; align-items: start;
  }
  @media (max-width: 980px) {
    main.layout { grid-template-columns: 1fr; }
    .output-panel { position: static !important; }
  }

  .categories { display: flex; flex-direction: column; gap: 18px; }

  .category {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow);
  }
  .category-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 6px;
  }
  .category-title { display: flex; align-items: center; gap: 10px; }
  .step-index {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em;
  }
  .category h2 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .category .hint {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-muted);
    border: 1px solid var(--line-strong); padding: 3px 8px; border-radius: 4px; white-space: nowrap;
  }
  .category .desc { color: var(--ink-muted); font-size: 13px; margin: 2px 0 14px; }

  .category-note {
    font-size: 12.5px; color: var(--ink-muted); border-left: 2px solid var(--accent);
    padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; margin: 0 0 14px;
  }
  .category-note b { color: var(--ink); }

  .subgroup { margin-bottom: 16px; }
  .subgroup:last-child { margin-bottom: 0; }
  .subgroup-label {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .subgroup-label::before { content: ''; width: 10px; height: 1px; background: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    position: relative;
    font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 7px; padding: 9px 30px 9px 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
  }
  .chip .en-tag {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;
    color: var(--ink-muted); text-transform: lowercase;
  }
  .chip:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.selected .en-tag { color: var(--accent-ink); opacity: 0.78; }
  .chip.selected::after {
    content: '✓'; position: absolute; top: 8px; right: 10px; font-size: 11px;
    font-family: var(--font-mono); color: var(--accent-ink);
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip-wrap { display: flex; flex-direction: column; }
  .attach-zone {
    position: relative; margin-top: 6px; border: 1px dashed var(--line-strong); border-radius: 6px;
    padding: 8px; text-align: center; cursor: pointer; background: var(--surface-2);
    min-height: 44px; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s, background 0.12s;
  }
  .attach-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .attach-zone .attach-hint {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); line-height: 1.4;
  }
  .attach-zone img.attach-preview { max-width: 100%; max-height: 90px; border-radius: 4px; display: block; }
  .attach-remove {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); color: var(--surface); border: none; font-size: 11px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
  }

  .custom-wrap { margin-top: 10px; display: none; }
  .custom-wrap.show { display: block; }
  .custom-wrap input {
    width: 100%; font-family: var(--font-body); font-size: 14px;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
  }
  .custom-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  textarea.extra-input {
    width: 100%; min-height: 64px; resize: vertical; font-family: var(--font-body);
    font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
  }
  textarea.extra-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Output panel */
  .output-panel { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }

  .ticket {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .ticket h3 {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 10px;
  }
  .ticket-pills { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
  .pill {
    font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft);
    color: var(--ink); border-radius: 4px; padding: 4px 8px; letter-spacing: 0.01em;
  }
  .ticket-empty { color: var(--ink-muted); font-size: 13px; font-style: italic; }

  .tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 5px; box-shadow: var(--shadow); }
  .tab-btn {
    flex: 1; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em;
    background: transparent; border: none; color: var(--ink-muted); padding: 10px 6px;
    border-radius: 7px; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  .prompt-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  }
  .prompt-card h3 { font-family: var(--font-display); font-size: 16px; margin: 0; font-weight: 700; }
  .prompt-card h4 {
    font-family: var(--font-display); font-size: 13px; margin: 0; font-weight: 700;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .prompt-card .tool-note { font-size: 12.5px; color: var(--ink-muted); margin: -6px 0 0; }
  .prompt-output {
    width: 100%; min-height: 220px; font-family: var(--font-mono); font-size: 12.5px;
    line-height: 1.6; padding: 12px; border-radius: 7px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .prompt-output.translation { min-height: 160px; }
  .prompt-actions { display: flex; gap: 8px; align-items: center; }
  .copy-btn {
    font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em;
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 10px 16px; border-radius: 7px; cursor: pointer;
  }
  .copy-btn:hover { filter: brightness(1.08); }
  .copy-btn.copied { background: var(--ink-muted); }
  .copy-btn.secondary {
    background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong);
  }
  .copy-btn.secondary:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  .translation-block {
    display: flex; flex-direction: column; gap: 10px;
    border-top: 1px dashed var(--line-strong); padding-top: 14px;
  }
  .translation-hint { font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--ink-muted); }

  .tip-box {
    font-size: 12.5px; color: var(--ink-muted); border-left: 2px solid var(--accent);
    padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0;
  }
  .tip-box b { color: var(--ink); }

  footer.note {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-muted); font-family: var(--font-mono);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="top">
    <div>
      <p class="eyebrow">Prompt Builder <span class="version-tag">v1.13</span></p>
      <h1>WiTH ARCHITECTURE Interior Remodeling Studio</h1>
      <p class="lede">공간·사진 유형·스타일·재료를 하나씩 선택하면, 미드저니 · 챗GPT · 제미나이용 영어 프롬프트와 한글 번역이 오른쪽에 자동으로 완성됩니다.</p>
    </div>
    <div class="header-controls">
      <div class="mood-switch" id="moodSwitch" role="group" aria-label="화면 분위기 선택">
        <button class="mood-btn" data-mood="studio" type="button">라이트</button>
        <button class="mood-btn" data-mood="noir" type="button">다크</button>
        <button class="mood-btn" data-mood="sand" type="button">웜</button>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">전체 초기화</button>
    </div>
  </header>

  <main class="layout">
    <div class="categories" id="categories"></div>

    <aside class="output-panel">
      <div class="ticket">
        <h3>선택 요약</h3>
        <div class="ticket-pills" id="ticketPills"><span class="ticket-empty">아직 선택한 항목이 없습니다</span></div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tool="mj" type="button">미드저니</button>
        <button class="tab-btn" data-tool="gpt" type="button">챗GPT</button>
        <button class="tab-btn" data-tool="gem" type="button">제미나이</button>
      </div>

      <div class="prompt-card" id="promptCard">
        <!-- filled by JS -->
      </div>
    </aside>
  </main>

  <footer class="note">모든 계산은 브라우저 안에서만 이루어지며, 선택 내용이나 사진은 어디로도 전송되지 않습니다.</footer>
</div>

      promptKo: '김형섭(위드건축사사무소, 제주) — 장식보다 동선과 용도가 공간 구성을 이끄는 기능주의적 접근. 거푸집 자국과 타이 구멍이 그대로 보이는 노출콘크리트 벽을 매끈하게 마감하지 않고 정직하게 그대로 드러냄. 검게 도장한 노출 천장과 노출 덕트로 인더스트리얼한 마감. 주방 아일랜드·계단·붙박이장 같은 원목·합판 가구가 노출콘크리트와 따뜻한 대비를 이룸. 세로 목재 루버 스크린을 파티션이나 벽면 포인트로 사용. 원형 펜던트 조명(트랙 조명 형태, 때로 컬러 유리 갓)과 천장의 은은한 코브(간접) 조명을 함께 사용. 높은 측창이나 좁은 리본창으로 사선광이 실내 깊숙이 들어오게 하는 채광 처리. 폴리싱 콘크리트 바닥과 절제된 회색 톤 베이스. 때때로 재료를 절제한 좌식(온돌) 웰니스 공간도 사용. 장식적 마감보다 재료 자체의 정직함과 절제를 지향함' },

    { id: 'renderStyle', title: '표현·렌더 스타일', hint: '단일 선택', desc: '결과 이미지를 어떤 방식으로 표현할지 선택하세요. (선택 사항, 기본은 실사 사진)', type: 'single', options: RENDER_STYLE_OPTIONS, customPlaceholder: '예: 아이소메트릭 3D 일러스트처럼' },

  // ---------- Mood switcher ----------
  var MOOD_KEY = 'irps-mood-v1';

  function applyMood(mood, persist) {
    document.documentElement.dataset.mood = mood;
    document.querySelectorAll('.mood-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.mood === mood); });
    if (persist) {
      try { localStorage.setItem(MOOD_KEY, mood); } catch (e) {}
    }
  }

  document.getElementById('moodSwitch').addEventListener('click', function (e) {
    var btn = e.target.closest('.mood-btn');
    if (!btn) return;
    applyMood(btn.dataset.mood, true);
  });

  (function initMood() {
    var saved = null;
    try { saved = localStorage.getItem(MOOD_KEY); } catch (e) {}
    var mood = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'noir' : 'studio');
    applyMood(mood, false);
  })();

  // ---------- State ----------
  var state = {
    source: null, planMode: null, space: null, bedsize: null, style: null,
    concept: [], palette: null, material: { floor: [], wall: [], ceiling: [] }, lighting: null,
    renderStyle: null, aspect: null, designer: null,
    extra: ''
  };
  var customText = { space: '', style: '', palette: '', lighting: '', renderStyle: '', designer: '' };
  var activeTool = 'mj';
  var sectionsById = {};
  var attachments = {};

  // ---------- Local-only reference attachments (drag & drop / click to browse) ----------
  // These previews never leave the browser — there is no backend to send them to.
  // They exist purely so the user can see, next to each option, which photo they
  // mean to use in Midjourney/ChatGPT/Gemini (uploaded separately, in those tools).
  function buildAttachWrap(chip, catId, optVal) {
    var wrap = document.createElement('div');
    wrap.className = 'chip-wrap';
    wrap.appendChild(chip);

    var zone = document.createElement('div');
    zone.className = 'attach-zone';
    zone.innerHTML =
      '<span class="attach-hint">클릭 또는 드래그해서<br>사진 첨부</span>' +
      '<img class="attach-preview" style="display:none" alt="첨부한 참고 이미지">' +
      '<button type="button" class="attach-remove" aria-label="첨부 삭제">×</button>';

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.hidden = true;

    var hint = zone.querySelector('.attach-hint');
    var previewImg = zone.querySelector('.attach-preview');
    var removeBtn = zone.querySelector('.attach-remove');

    function setPreview(file) {
      if (!file || file.type.indexOf('image/') !== 0) return;
      var key = catId + ':' + optVal;
      if (attachments[key]) URL.revokeObjectURL(attachments[key].url);
      var url = URL.createObjectURL(file);
      attachments[key] = { name: file.name, url: url };
      previewImg.src = url;
      previewImg.style.display = 'block';
      hint.style.display = 'none';
      removeBtn.style.display = 'flex';
      if (!chip.classList.contains('selected')) chip.click();
    }

    zone.addEventListener('click', function (e) {
      if (e.target === removeBtn) return;
      fileInput.click();
    });
    fileInput.addEventListener('change', function () {
      if (fileInput.files && fileInput.files[0]) setPreview(fileInput.files[0]);
    });
    zone.addEventListener('dragover', function (e) {
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', function () {
      zone.classList.remove('dragover');
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('dragover');
      var file = e.dataTransfer.files && e.dataTransfer.files[0];
      setPreview(file);
    });
    removeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var key = catId + ':' + optVal;
      if (attachments[key]) { URL.revokeObjectURL(attachments[key].url); delete attachments[key]; }
      previewImg.src = '';
      previewImg.style.display = 'none';
      hint.style.display = 'block';
      removeBtn.style.display = 'none';
      fileInput.value = '';
    });

    wrap.appendChild(zone);
    wrap.appendChild(fileInput);
    return wrap;
  }

  function clearAllAttachments() {
    Object.keys(attachments).forEach(function (k) { URL.revokeObjectURL(attachments[k].url); });
    attachments = {};
    document.querySelectorAll('.attach-zone').forEach(function (zone) {
      var img = zone.querySelector('.attach-preview');
      img.src = '';
      img.style.display = 'none';
      zone.querySelector('.attach-hint').style.display = 'block';
      zone.querySelector('.attach-remove').style.display = 'none';
    });
  }

  // ---------- Build category UI ----------
  var categoriesEl = document.getElementById('categories');

  CATEGORIES.forEach(function (cat, idx) {
    var section = document.createElement('section');
    section.className = 'category';
    sectionsById[cat.id] = section;

    var head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML =
      '<div class="category-title"><span class="step-index">' + String(idx + 1).padStart(2, '0') + '</span><h2>' + cat.title + '</h2></div>' +
      '<span class="hint">' + cat.hint + '</span>';
    section.appendChild(head);

    var desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = cat.desc;
    section.appendChild(desc);

    if (cat.note) {
      var noteEl = document.createElement('p');
      noteEl.className = 'category-note';
      noteEl.innerHTML = '<b>Tip.</b> ' + cat.note;
      section.appendChild(noteEl);
    }

    if (cat.groups) {
      cat.groups.forEach(function (grp) {
        var groupWrap = document.createElement('div');
        groupWrap.className = 'subgroup';

        var groupLabel = document.createElement('div');
        groupLabel.className = 'subgroup-label';
        groupLabel.textContent = grp.label;
        groupWrap.appendChild(groupLabel);

        var groupChips = document.createElement('div');
        groupChips.className = 'chips';

        grp.options.forEach(function (opt) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.dataset.cat = cat.id;
          chip.dataset.group = grp.id;
          chip.dataset.val = opt.v;
          var inner = '<span>' + opt.ko + '</span>';
          if (opt.en) inner += '<span class="en-tag">' + opt.en + '</span>';
          chip.innerHTML = inner;

          chip.addEventListener('click', function () {
            if (cat.type === 'single') {
              handleGroupedSingleClick(cat, grp, opt, chip);
            } else {
              handleGroupedChipClick(cat, grp, opt, chip);
            }
          });

          groupChips.appendChild(chip);
        });

        groupWrap.appendChild(groupChips);
        section.appendChild(groupWrap);
      });

      if (cat.type === 'single') {
        var hasCustomGrouped = cat.groups.some(function (g) { return g.options.some(function (o) { return o.custom; }); });
        if (hasCustomGrouped) {
          var customWrapGrouped = document.createElement('div');
          customWrapGrouped.className = 'custom-wrap';
          customWrapGrouped.innerHTML = '<input type="text" placeholder="예: 안도 다다오 느낌으로" data-custom-for="' + cat.id + '">';
          section.appendChild(customWrapGrouped);
          var inputGrouped = customWrapGrouped.querySelector('input');
          inputGrouped.addEventListener('input', function () {
            customText[cat.id] = inputGrouped.value;
            render();
          });
        }
      }

      categoriesEl.appendChild(section);
      return;
    }

    var chips = document.createElement('div');
    chips.className = 'chips';

    var customWrap = null;

    cat.options.forEach(function (opt) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.cat = cat.id;
      chip.dataset.val = opt.v;
      var inner = '<span>' + opt.ko + '</span>';
      if (opt.en) inner += '<span class="en-tag">' + opt.en + '</span>';
      chip.innerHTML = inner;

      chip.addEventListener('click', function () {
        handleChipClick(cat, opt, chip, section);
      });

      if (cat.allowAttachment && !opt.custom) {
        chips.appendChild(buildAttachWrap(chip, cat.id, opt.v));
      } else {
        chips.appendChild(chip);
      }
    });

    section.appendChild(chips);

    var hasCustom = cat.options.some(function (o) { return o.custom; });
    if (hasCustom) {
      customWrap = document.createElement('div');
      customWrap.className = 'custom-wrap';
      customWrap.innerHTML = '<input type="text" placeholder="' + (cat.customPlaceholder || '예: 빈티지 아르데코 스타일') + '" data-custom-for="' + cat.id + '">';
      section.appendChild(customWrap);
      var input = customWrap.querySelector('input');
      input.addEventListener('input', function () {
        customText[cat.id] = input.value;
        render();
      });
    }

    categoriesEl.appendChild(section);
  });

  // extra free-text category
  var extraSection = document.createElement('section');
  extraSection.className = 'category';
  extraSection.innerHTML =
    '<div class="category-head"><div class="category-title"><span class="step-index">' + String(CATEGORIES.length + 1).padStart(2, '0') + '</span><h2>추가 요청사항</h2></div><span class="hint">자유 입력</span></div>' +
    '<p class="desc">위 항목으로 표현되지 않는 세부 요청을 자유롭게 적어주세요. (선택 사항)</p>';
  var extraTa = document.createElement('textarea');
  extraTa.className = 'extra-input';
  extraTa.placeholder = '예: 반려동물이 있는 가족을 위한 내구성 좋은 바닥재로, 수납공간을 최대한 확보해줘';

    render();

  categoriesEl.appendChild(extraSection);

  // ---------- Conditional categories (e.g. bed size only for bedroom/kids room) ----------
  function updateConditionalVisibility() {
    CATEGORIES.forEach(function (cat) {
      if (!cat.conditional) return;
      var controllingVal = state[cat.conditional.on];
      var show = !!controllingVal && cat.conditional.values.indexOf(controllingVal.v) !== -1;
      var sec = sectionsById[cat.id];
      sec.style.display = show ? '' : 'none';
      if (!show && state[cat.id]) {
        state[cat.id] = null;
        var selected = sec.querySelector('.chip.selected');
        if (selected) selected.classList.remove('selected');
      }
    });
  }

  function handleChipClick(cat, opt, chip, section) {
    if (cat.type === 'single' && cat.deselectable && chip.classList.contains('selected')) {
      // 이미 선택된 칩을 다시 누르면 선택 해제 (예: 화면 비율은 "선택 안 함"이 기본 동작)
      chip.classList.remove('selected');
      state[cat.id] = null;
      updateConditionalVisibility();
      render();
      return;
    }
    if (cat.type === 'single') {
      var siblings = section.querySelectorAll('.chip');
      siblings.forEach(function (c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
      state[cat.id] = opt;

      var cw = section.querySelector('.custom-wrap');
      if (cw) {
        if (opt.custom) {
          cw.classList.add('show');
          cw.querySelector('input').focus();
        } else {
          cw.classList.remove('show');
        }
      }
    } else {
      var isSelected = chip.classList.toggle('selected');
      if (isSelected) {
        state[cat.id].push(opt);
      } else {
        state[cat.id] = state[cat.id].filter(function (o) { return o.v !== opt.v; });
      }
    }
    updateConditionalVisibility();
    render();
  }

  function handleGroupedChipClick(cat, grp, opt, chip) {
    var arr = state[cat.id][grp.id];
    var isSelected = chip.classList.toggle('selected');
    if (isSelected) {
      arr.push(opt);
    } else {
      state[cat.id][grp.id] = arr.filter(function (o) { return o.v !== opt.v; });
    }
    render();
  }

  function handleGroupedSingleClick(cat, grp, opt, chip) {
    var allChipsInCat = sectionsById[cat.id].querySelectorAll('.chip');
    allChipsInCat.forEach(function (c) { c.classList.remove('selected'); });
    chip.classList.add('selected');
    state[cat.id] = opt;

    lines.push('');
    if (sourceVal === 'plan' && planModeVal === 'axono') {
      lines.push('※ 중요: 도면 전체가 한 번에 보이는 액소노메트릭 조감 시점 하나로만 렌더링해줘. 방 하나만 보이는 눈높이 인테리어 사진이 되면 안 돼.');
    } else if (sourceVal === 'plan' && planModeVal === 'room') {
      lines.push('※ 중요: 표시된 공간 하나에 대해서만 자연스러운 눈높이 시점으로 렌더링하고, 도면의 다른 공간은 무시해줘. 그 공간의 구조나 배치를 임의로 바꾸지 마.');
    } else if (sourceVal === 'plan') {
      lines.push('※ 중요: 도면에 맞는 하나의 자연스러운 눈높이 시점으로만 렌더링하고, 구조나 배치를 임의로 바꾸지 마.');
    } else {
      lines.push('※ 중요: 원본 사진의 카메라 각도·렌즈 시점·구도는 어떤 경우에도 절대 바꾸지 말고 촬영된 그대로 유지해줘.');
    }

    if (sourceVal === 'plan') {
      lines.push('※ 중요: 도면에 그려진 가구 배치와 개수를 그대로 유지해줘 — 도면에 있는 위치에서 가구를 추가하거나 빼거나 옮기지 마.');
    }

    if (state.aspect && state.aspect.safe) {
      lines.push('');
      lines.push(SAFE_ZONE_KO);
    }

    var detailLines = [];
    var bedsizeKo = resolvedKo('bedsize');
    if (bedsizeKo) detailLines.push('- 침대 사이즈: ' + bedsizeKo);
    var conceptKo = listKo('concept');
    if (conceptKo.length) detailLines.push('- 건축적 개념: ' + conceptKo.join(', '));
    var paletteKo = resolvedKo('palette');
    if (paletteKo) detailLines.push('- 컬러 팔레트: ' + paletteKo);
    materialBulletsKo().forEach(function (b) { detailLines.push('- ' + b); });
    var lightingKo = resolvedKo('lighting');
    if (lightingKo) detailLines.push('- 조명: ' + lightingKo);
    var designerKo2 = designerPromptKo();
    if (designerKo2) detailLines.push('- 레퍼런스 디자이너: ' + designerKo2);
    var renderStyleKo2 = resolvedKo('renderStyle');
    if (renderStyleKo2) detailLines.push('- 표현 기법: ' + renderStyleKo2);
    if (state.extra) detailLines.push('- 추가 요청: ' + state.extra);

    if (detailLines.length) {
      lines.push('');
      lines.push('반영할 요소:');
      lines = lines.concat(detailLines);
    }

    lines.push('');
    if (renderStyleKoLong) {
      lines.push('※ 표현 기법 지시 (다시 한번 강조): ' + renderStyleKoLong);
    } else {
      lines.push('결과물은 실제 시공 후 촬영한 것처럼 사실적이고 디테일하게 표현해줘.');
    }

    return lines.join('\n');
  }

  var TOOL_META = {
    mj: {
      label: '미드저니',
      note: 'Discord의 /imagine 창에 사진을 함께 첨부하거나, 이미지를 먼저 업로드해 받은 URL을 프롬프트 맨 앞 [PASTE IMAGE URL HERE] 자리에 붙여넣으세요.',
      buildEn: buildMidjourneyEN,
      buildKo: buildMidjourneyKO
    },
    gpt: {
      label: '챗GPT',
      note: '대화창에 원본 사진을 첨부한 뒤, 아래 영어 프롬프트를 그대로 붙여넣으세요.',
      buildEn: function () { return buildConversationalEN(false); },
      buildKo: function () { return buildConversationalKO(false); }
    },
    gem: {
      label: '제미나이',
      note: '제미나이(나노바나나)에 원본 사진을 첨부한 뒤, 아래 영어 프롬프트를 그대로 붙여넣으세요. 사진 편집 특성상 구조를 그대로 유지하도록 구성했습니다.',
      buildEn: function () { return buildConversationalEN(true); },
      buildKo: function () { return buildConversationalKO(true); }
    }
  };

  // ---------- Render ----------
  var promptCard = document.getElementById('promptCard');
  var ticketPills = document.getElementById('ticketPills');

  function render() {
    // ticket
    var pills = [];
    if (state.source) pills.push(state.source.ko);
    if (state.planMode) pills.push(state.planMode.ko);
    var s = resolvedKo('space'); if (s) pills.push(s);
    var bs = resolvedKo('bedsize'); if (bs) pills.push(bs);
    var st = resolvedKo('style'); if (st) pills.push(st);
    listKo('concept').forEach(function (v) { pills.push(v); });
    var p = resolvedKo('palette'); if (p) pills.push(p);
    ['floor', 'wall', 'ceiling'].forEach(function (g) {
      state.material[g].forEach(function (o) { pills.push(o.ko); });
    });
    var l = resolvedKo('lighting'); if (l) pills.push(l);
    var rs = resolvedKo('renderStyle'); if (rs) pills.push(rs);
    if (state.aspect) pills.push('비율 ' + state.aspect.ko);
    var dz = resolvedKo('designer'); if (dz) pills.push(dz);

    if (pills.length) {
      ticketPills.innerHTML = pills.map(function (t) { return '<span class="pill">' + escapeHtml(t) + '</span>'; }).join('');
    } else {
      ticketPills.innerHTML = '<span class="ticket-empty">아직 선택한 항목이 없습니다</span>';
    }

    // prompt card
    var meta = TOOL_META[activeTool];
    var textEn = meta.buildEn();
    var textKo = meta.buildKo();
    promptCard.innerHTML =
      '<h3>' + meta.label + '용 프롬프트 (English)</h3>' +
      '<p class="tool-note">' + meta.note + '</p>' +
      '<textarea class="prompt-output" id="promptOutputEn" spellcheck="false">' + escapeHtml(textEn) + '</textarea>' +
      '<div class="prompt-actions"><button class="copy-btn" id="copyBtnEn" type="button">영어 프롬프트 복사</button></div>' +
      '<div class="translation-block">' +
        '<h4>한글 번역 <span class="translation-hint">참고용 — 실제 입력은 위 영어 프롬프트를 사용하세요</span></h4>' +
        '<textarea class="prompt-output translation" id="promptOutputKo" spellcheck="false">' + escapeHtml(textKo) + '</textarea>' +
        '<div class="prompt-actions"><button class="copy-btn secondary" id="copyBtnKo" type="button">한글 번역 복사</button></div>' +
      '</div>' +
      '<div class="tip-box"><b>Tip.</b> 공간·스타일만 선택해도 프롬프트가 만들어져요. 나머지 항목은 선택할수록 결과가 더 구체적이고 정교해집니다.</div>';

    document.getElementById('copyBtnEn').addEventListener('click', function () {
      copyText(document.getElementById('promptOutputEn').value, this, '영어 프롬프트 복사');
    });
    document.getElementById('copyBtnKo').addEventListener('click', function () {
      copyText(document.getElementById('promptOutputKo').value, this, '한글 번역 복사');
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function copyText(text, btn, originalLabel) {
    var done = function () {
      btn.textContent = '복사됨!';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = originalLabel; btn.classList.remove('copied'); }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }

  render();
})();
</script>
</body>
</html>
